# Open 模式（推荐）
# 启动: docker compose up -d
# Cookie 模式见下方注释示例

services:
  quarkdrive-webdav:
    image: ghcr.io/poiig/quarkdrive-webdav:latest
    container_name: quarkdrive-webdav
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QUARK_OPEN: "true"
      QUARK_TOKEN_FILE: /data/quark-token.json
      WEBDAV_AUTH_USER: admin
      WEBDAV_AUTH_PASSWORD: admin
      UPLOAD_MEMORY_LIMIT: 512MB
      OP_LOG_DIR: /app/logs
      OP_LOG_RETENTION_DAYS: "7"
      # WECOM_WEBHOOK_KEY: 你的企微机器人key
    volumes:
      - ./data:/data
      - ./logs:/app/logs

# Cookie 模式示例（替换上面 environment 即可）:
#   environment:
#     QUARK_COOKIE: 你的cookie
#     WEBDAV_AUTH_USER: admin
#     WEBDAV_AUTH_PASSWORD: admin
#     UPLOAD_MEMORY_LIMIT: 64MB
#     OP_LOG_DIR: /app/logs
#     OP_LOG_RETENTION_DAYS: "7"
#     # WECOM_WEBHOOK_KEY: 你的企微机器人key
